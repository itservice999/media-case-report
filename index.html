<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Case Report</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#16252d;--mute:#5d7079;--line:#d5dee3;--acc:#0b6e6e;--acc2:#e3f1f1;--danger:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Noto Sans Thai',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:10px 20px}
header b{font-size:17px;margin-right:8px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:#b9cad1;padding:7px 14px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff}
main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mute)}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:3px}
textarea{min-height:70px;resize:vertical}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 16px;cursor:pointer;width:auto}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.del{background:#fff;color:var(--danger);border:1px solid var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.picker{border:1px solid var(--line);border-radius:8px;padding:12px;background:#f8fafb}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px;max-height:260px;overflow:auto;margin-top:10px}
.chips label{display:flex;gap:7px;align-items:center;color:var(--ink);padding:5px 8px;border-radius:6px;background:#fff;border:1px solid var(--line);cursor:pointer;margin:0}
.chips label.on{background:var(--acc2);border-color:var(--acc)}
.chips input{width:auto;margin:0}
.count{font-weight:700;color:var(--acc)}
.big{font-size:30px;font-weight:700;color:var(--acc);line-height:1.1}
.item{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
.item summary{padding:10px 14px;cursor:pointer;display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
.item summary b{flex:1 1 220px}
.item .body{padding:4px 14px 14px;border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;margin:10px 0;white-space:pre-wrap}
.kv span:nth-child(odd){color:var(--mute)}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:4px;padding:1px 8px;font-size:12px;margin:2px 3px 2px 0}
.mute{color:var(--mute)}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto}
#lock{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:9}
#lock form{background:#fff;border-radius:10px;padding:26px;width:min(340px,90vw)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:10}
.hide{display:none}
</style>
</head>
<body>
<div id="lock"><form id="lockf"><h2>Media Case Report</h2><label>รหัสผ่านทีม<input id="pw" type="password" autocomplete="off" autocapitalize="none" autocorrect="off"></label><p id="lockerr" class="mute" style="color:var(--danger);margin:6px 0"></p><button class="btn">เข้าสู่ระบบ</button></form></div>

<header><b>Media Case Report</b>
<nav id="nav">
<button data-v="branch" class="on">ดูตามสาขา</button>
<button data-v="form">บันทึกชุดข้อมูล</button>
<button data-v="list">ชุดข้อมูลทั้งหมด</button>
<button data-v="branches">จัดการสาขา</button>
</nav></header>

<main>
<section id="v-branch">
 <div class="card">
  <h2>ค้นหาสาขา</h2>
  <label>พิมพ์หรือเลือกชื่อสาขา<input id="bsel" list="blist" placeholder="เช่น นครปฐม"></label>
  <datalist id="blist"></datalist>
 </div>
 <div id="bres"></div>
</section>

<section id="v-form" class="hide">
 <form id="f" class="card">
  <h2 id="ftitle">บันทึกชุดข้อมูลใหม่</h2>
  <div class="grid">
   <label>ลูกค้า<input name="customer" list="d-customer" required></label>
   <label>ผู้แจ้ง<input name="reporter" list="d-reporter"></label>
   <label>เลขที่ติดตามงาน<input name="tracking_no"></label>
   <label>ความสำคัญ<select name="priority"><option>P1</option><option selected>P2</option><option>P3</option></select></label>
   <label>วันเวลาที่รับแจ้ง<input name="received_at" type="datetime-local"></label>
   <label>ประเภทจอ<input name="job_type" list="d-job_type"></label>
   <label>วันที่กำหนดส่งสื่อ<input name="due_date" type="date"></label>
   <label>วันหมดอายุสื่อ<input name="expire_date" type="date"></label>
   <label>สถานะงาน<input name="status" list="d-status"></label>
   <label>ผู้ดำเนินการ<input name="operator" list="d-operator"></label>
  </div>
  <label style="margin-top:12px">ข้อมูลสื่อ (ชื่อสื่อ / ลิงก์)<textarea name="media_info"></textarea></label>
  <label style="margin-top:12px">รายละเอียดการดำเนินการ<textarea name="details"></textarea></label>
  <label style="margin-top:12px">หมายเหตุ<textarea name="remarks"></textarea></label>
  <div class="picker" style="margin-top:16px">
   <div class="row"><b>ส่งไปสาขา</b> <span>เลือกแล้ว <span class="count" id="pcount">0</span> / <span id="ptotal">0</span> สาขา</span></div>
   <div class="row" style="margin-top:8px">
    <input id="psearch" placeholder="พิมพ์ค้นหาสาขา" style="max-width:240px;margin:0">
    <button type="button" class="btn ghost sm" id="pall">เลือกทั้งหมดที่เห็น</button>
    <button type="button" class="btn ghost sm" id="pnone">ล้างที่เลือก</button>
   </div>
   <div class="chips" id="chips"></div>
  </div>
  <div class="row" style="margin-top:16px">
   <button class="btn" id="fsave">บันทึก</button>
   <button type="button" class="btn ghost" id="fcancel">ล้างฟอร์ม</button>
  </div>
 </form>
 <datalist id="d-customer"></datalist><datalist id="d-reporter"></datalist><datalist id="d-job_type"></datalist><datalist id="d-status"></datalist><datalist id="d-operator"></datalist>
</section>

<section id="v-list" class="hide">
 <div class="card">
  <h2>ชุดข้อมูลทั้งหมด <span class="mute" id="lcount"></span></h2>
  <div class="grid">
   <label>ค้นหา<input id="lq" placeholder="ลูกค้า ผู้แจ้ง ชื่อสื่อ เลขงาน"></label>
   <label>ประเภทจอ<select id="ljob"></select></label>
  </div>
  <div class="row" style="margin-top:10px"><button class="btn ghost sm" id="export">สำรองข้อมูลเป็น Excel (CSV)</button></div>
 </div>
 <div id="lres"></div>
</section>

<section id="v-branches" class="hide">
 <div class="card">
  <h2>เพิ่มรายชื่อสาขา</h2>
  <p class="mute" style="margin-top:0">วางรายชื่อสาขาทั้งหมดได้เลย บรรทัดละ 1 สาขา (คัดลอกจากคอลัมน์ใน Excel มาวางได้) สาขาที่มีอยู่แล้วจะข้ามให้</p>
  <textarea id="bpaste" style="min-height:140px" placeholder="นครปฐม&#10;หาดใหญ่&#10;ขอนแก่น"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn" id="badd">เพิ่มสาขา</button></div>
 </div>
 <div class="card"><h2>สาขาทั้งหมด <span class="mute" id="bcount"></span></h2><div id="bmanage"></div></div>
</section>
</main>
<div id="toast"></div>

<script>
let SB;try{SB=supabase.createClient('https://mirjakkcglnmlrycrzzj.supabase.co','sb_publishable_URDSOunoGqhCCjvPRiyXFw_0jmS5TVN')}catch(e){console.error(e)}
const PASS='media2026';
const S={cases:[],branches:[],links:[],sel:new Set(),editId:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3000)};
const FIELDS=[['customer','ลูกค้า'],['reporter','ผู้แจ้ง'],['tracking_no','เลขที่ติดตามงาน'],['priority','ความสำคัญ'],['received_at','วันเวลาที่รับแจ้ง'],['job_type','ประเภทจอ'],['media_info','ข้อมูลสื่อ'],['due_date','กำหนดส่งสื่อ'],['expire_date','หมดอายุสื่อ'],['status','สถานะงาน'],['operator','ผู้ดำเนินการ'],['details','รายละเอียดการดำเนินการ'],['remarks','หมายเหตุ']];

// ---- lock ----
function unlock(){$('lock').classList.add('hide');boot()}
if(localStorage.getItem('mcr_ok')==='1')unlock();
$('lockf').onsubmit=e=>{e.preventDefault();if($('pw').value.trim().toLowerCase()===PASS){localStorage.setItem('mcr_ok','1');unlock()}else $('lockerr').textContent='รหัสผ่านไม่ถูกต้อง'};

// ---- data ----
async function all(table,order){let out=[],from=0;for(;;){const{data,error}=await SB.from(table).select('*').order(order,{ascending:true}).range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)break;from+=1000}return out}
async function load(){
 try{
  const [c,b,l]=await Promise.all([all('cases','id'),all('branches','name'),all('case_branches','case_id')]);
  S.cases=c.map(r=>{for(const k in r)if(typeof r[k]==='string')r[k]=r[k].trim();r.received_at=fixDate(r.received_at);return r});
  S.branches=b.map(x=>x.name);S.links=l;
  S.byCase={};S.byBranch={};
  l.forEach(x=>{(S.byCase[x.case_id]??=[]).push(x.branch);(S.byBranch[x.branch]??=new Set()).add(x.case_id)});
  render();
 }catch(e){console.error(e);toast('เชื่อมต่อฐานข้อมูลไม่สำเร็จ: '+(e.message||e))}
}
function fixDate(v){ // แก้ปี พ.ศ. ให้เป็น ค.ศ.
 const m=String(v||'').match(/^(\d{4})(.*)$/);
 return m&&+m[1]>2100?(+m[1]-543)+m[2]:(v||'');
}
function fmtDate(v){
 if(!v)return '';const d=new Date(v);if(isNaN(d))return v;
 return d.toLocaleString('th-TH-u-ca-gregory',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
const brOf=id=>(S.byCase[id]||[]).slice().sort((a,b)=>a.localeCompare(b,'th'));

// ---- nav ----
$('nav').onclick=e=>{const v=e.target.dataset.v;if(!v)return;
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b===e.target));
 ['branch','form','list','branches'].forEach(x=>$('v-'+x).classList.toggle('hide',x!==v));render()};
function go(v){document.querySelector(`#nav [data-v=${v}]`).click()}

function render(){renderLists();renderPicker();renderBranch();renderList();renderManage()}
function renderLists(){
 const dl=(k,vals)=>$('d-'+k).innerHTML=[...new Set(vals.filter(Boolean))].sort().map(v=>`<option value="${esc(v)}">`).join('');
 ['customer','reporter','job_type','status','operator'].forEach(k=>dl(k,S.cases.map(c=>c[k])));
 $('blist').innerHTML=S.branches.map(b=>`<option value="${esc(b)}">`).join('');
 const jobs=[...new Set(S.cases.map(c=>c.job_type).filter(Boolean))].sort(),cur=$('ljob').value;
 $('ljob').innerHTML='<option value="">ทุกประเภทจอ</option>'+jobs.map(j=>`<option>${esc(j)}</option>`).join('');$('ljob').value=cur;
}

// ---- case card ----
function caseItem(c,opts={}){
 const b=brOf(c.id);
 return `<details class="item"><summary><b>${esc(c.customer)}${c.media_info?' · '+esc(c.media_info.split('\n')[0].slice(0,70)):''}</b>
  <span class="mute">${esc(c.job_type)}</span><span class="mute">${esc(fmtDate(c.received_at))}</span><span class="tag">${b.length} สาขา</span></summary>
  <div class="body"><div class="kv">${FIELDS.map(([k,l])=>`<span>${l}</span><span>${esc(k==='received_at'?fmtDate(c[k]):c[k])||'-'}</span>`).join('')}
  <span>ส่งไปสาขา</span><span>${b.map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'-'}</span></div>
  ${c.image_url?`<a href="${esc(c.image_url)}" target="_blank"><img src="${esc(c.image_url)}" alt="" style="max-width:240px;border-radius:6px"></a>`:''}
  <div class="row"><button class="btn ghost sm" onclick="editCase('${esc(c.id)}')">แก้ไข / เพิ่มสาขา</button><button class="btn del sm" onclick="delCase('${esc(c.id)}')">ลบ</button></div></div></details>`;
}

// ---- view: branch ----
function renderBranch(){
 const name=$('bsel').value.trim(),el=$('bres');
 if(!name){el.innerHTML='<div class="card mute">เลือกสาขาเพื่อดูว่าสาขานั้นมีชุดข้อมูลอะไรบ้าง</div>';return}
 if(!S.branches.includes(name)){el.innerHTML='<div class="card mute">ไม่พบสาขานี้ในรายชื่อ ลองเลือกจากรายการที่แนะนำ</div>';return}
 const ids=[...(S.byBranch[name]||[])],rows=S.cases.filter(c=>ids.includes(c.id)).sort((a,b)=>(b.received_at||'').localeCompare(a.received_at||''));
 const cust=new Set(rows.map(r=>r.customer)).size,jobs=new Set(rows.map(r=>r.job_type).filter(Boolean)).size;
 el.innerHTML=`<div class="card"><div class="row" style="gap:36px"><div><div class="big">${rows.length}</div>ชุดข้อมูลในสาขานี้</div><div><div class="big">${cust}</div>ลูกค้า</div><div><div class="big">${jobs}</div>ประเภทจอ</div></div></div>`+
  (rows.map(c=>caseItem(c)).join('')||'<div class="card mute">สาขานี้ยังไม่มีชุดข้อมูล</div>');
}
$('bsel').oninput=renderBranch;

// ---- view: form ----
function renderPicker(){
 const q=$('psearch').value.trim().toLowerCase();
 $('ptotal').textContent=S.branches.length;$('pcount').textContent=S.sel.size;
 $('chips').innerHTML=S.branches.filter(b=>b.toLowerCase().includes(q)).map(b=>`<label class="${S.sel.has(b)?'on':''}"><input type="checkbox" value="${esc(b)}" ${S.sel.has(b)?'checked':''}>${esc(b)}</label>`).join('')||'<span class="mute">ยังไม่มีสาขา ไปที่แท็บ "จัดการสาขา" เพื่อเพิ่ม</span>';
}
$('chips').onchange=e=>{e.target.checked?S.sel.add(e.target.value):S.sel.delete(e.target.value);renderPicker()};
$('psearch').oninput=renderPicker;
$('pall').onclick=()=>{const q=$('psearch').value.trim().toLowerCase();S.branches.filter(b=>b.toLowerCase().includes(q)).forEach(b=>S.sel.add(b));renderPicker()};
$('pnone').onclick=()=>{S.sel.clear();renderPicker()};

function resetForm(){$('f').reset();S.editId=null;S.sel.clear();$('ftitle').textContent='บันทึกชุดข้อมูลใหม่';$('psearch').value='';renderPicker()}
$('fcancel').onclick=resetForm;
window.editCase=id=>{const c=S.cases.find(x=>x.id===id);if(!c)return;go('form');resetForm();S.editId=id;
 FIELDS.forEach(([k])=>{const el=$('f').elements[k];if(el)el.value=k==='received_at'?(c[k]||'').slice(0,16):(c[k]||'')});
 S.sel=new Set(brOf(id));$('ftitle').textContent='แก้ไขชุดข้อมูล';renderPicker();scrollTo(0,0)};

$('f').onsubmit=async e=>{
 e.preventDefault();const btn=$('fsave');btn.disabled=true;
 try{
  const row={id:S.editId||('c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6))};
  FIELDS.forEach(([k])=>row[k]=$('f').elements[k].value.trim());
  row.received_at=fixDate(row.received_at);
  if(!S.editId)row.created_at=new Date().toISOString();
  let r=await SB.from('cases').upsert(row);if(r.error)throw r.error;
  r=await SB.from('case_branches').delete().eq('case_id',row.id);if(r.error)throw r.error;
  const links=[...S.sel].map(b=>({case_id:row.id,branch:b}));
  if(links.length){r=await SB.from('case_branches').insert(links);if(r.error)throw r.error}
  toast(`บันทึกแล้ว ส่งไป ${links.length} สาขา`);resetForm();await load();
 }catch(err){console.error(err);toast('บันทึกไม่สำเร็จ: '+(err.message||err))}
 btn.disabled=false;
};
window.delCase=async id=>{if(!confirm('ลบชุดข้อมูลนี้และรายการสาขาที่ผูกไว้?'))return;
 await SB.from('case_branches').delete().eq('case_id',id);const r=await SB.from('cases').delete().eq('id',id);
 r.error?toast('ลบไม่สำเร็จ'):toast('ลบแล้ว');load()};

// ---- view: list ----
function renderList(){
 const q=$('lq').value.trim().toLowerCase(),j=$('ljob').value;
 const rows=S.cases.filter(c=>(!j||c.job_type===j)&&(!q||[c.customer,c.reporter,c.media_info,c.tracking_no,c.operator].join(' ').toLowerCase().includes(q)))
  .sort((a,b)=>(b.received_at||'').localeCompare(a.received_at||''));
 $('lcount').textContent=`(${rows.length} ชุด)`;
 $('lres').innerHTML=rows.slice(0,200).map(c=>caseItem(c)).join('')+(rows.length>200?'<p class="mute">แสดง 200 รายการแรก ใช้ช่องค้นหาเพื่อกรองเพิ่ม</p>':'')||'<div class="card mute">ยังไม่มีข้อมูล</div>';
}
$('lq').oninput=renderList;$('ljob').onchange=renderList;
$('export').onclick=()=>{
 const head=[...FIELDS.map(f=>f[1]),'สาขา'];
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const lines=[head.map(q).join(',')].concat(S.cases.map(c=>[...FIELDS.map(([k])=>c[k]),brOf(c.id).join(' | ')].map(q).join(',')));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv'}));
 a.download='media-case-backup-'+new Date().toISOString().slice(0,10)+'.csv';a.click()};

// ---- view: manage branches ----
function renderManage(){
 $('bcount').textContent=`(${S.branches.length} สาขา)`;
 $('bmanage').innerHTML=S.branches.map(b=>`<span class="tag">${esc(b)} <span class="mute">${(S.byBranch[b]||new Set()).size}</span> <a href="#" onclick="delBranch('${esc(b).replace(/'/g,"\\'")}');return false" style="color:var(--danger);text-decoration:none" title="ลบสาขา">×</a></span>`).join('')||'<span class="mute">ยังไม่มีสาขา</span>';
}
$('badd').onclick=async()=>{
 const names=[...new Set($('bpaste').value.split('\n').map(s=>s.trim()).filter(Boolean))].filter(n=>!S.branches.includes(n));
 if(!names.length)return toast('ไม่มีสาขาใหม่ให้เพิ่ม');
 const r=await SB.from('branches').insert(names.map(name=>({name})));
 if(r.error)return toast('เพิ่มไม่สำเร็จ: '+r.error.message);
 $('bpaste').value='';toast(`เพิ่ม ${names.length} สาขาแล้ว`);load()};
window.delBranch=async b=>{if(!confirm(`ลบสาขา "${b}" และการส่งสื่อไปสาขานี้ทั้งหมด?`))return;
 await SB.from('case_branches').delete().eq('branch',b);await SB.from('branches').delete().eq('name',b);load()};

function boot(){load();setInterval(()=>{if(document.activeElement.tagName!=='TEXTAREA'&&document.activeElement.tagName!=='INPUT')load()},30000)}
</script>
</body>
</html>
